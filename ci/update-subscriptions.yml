name: Update subscriptions

on:
  schedule:
    # Every six hours; scheduled workflows run from the default branch.
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-subscriptions
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Run aggregator tests
        run: python -m unittest discover -s tests -v

      - name: Aggregate sources
        run: python scripts/aggregate.py --config config/sources.json --output-dir data

      - name: Publish generated feeds
        run: |
          if [ -z "$(git status --porcelain -- data)" ]; then
            echo "No feed changes to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "chore: refresh subscription feeds"
          git push
