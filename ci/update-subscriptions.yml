name: Update subscriptions

on:
  schedule:
    # Every six hours; scheduled workflows run from the default branch.
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      health_check:
        description: "Run advisory TCP/TLS health probes"
        type: boolean
        default: false
      ai_review:
        description: "Ask the optional 9Router gateway for a sanitized review"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-subscriptions
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Aggregate and verify
        env:
          NINEROUTER_URL: ${{ secrets.NINEROUTER_URL }}
          NINEROUTER_KEY: ${{ secrets.NINEROUTER_KEY }}
          NINEROUTER_MODEL: ${{ vars.NINEROUTER_MODEL }}
        run: |
          args=(--config config/sources.json --output-dir data --retries 2)
          if [ "${{ inputs.health_check }}" = "true" ]; then
            args+=(--health-check --health-concurrency 24 --tcp-timeout 3)
          fi
          if [ "${{ inputs.ai_review }}" = "true" ]; then
            args+=(--ai-review --telemetry telemetry/last-run.jsonl)
          fi
          python scripts/aggregate.py "${args[@]}"
          python scripts/verify.py --data-dir data

      - name: Upload verified feeds
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: subscription-feeds
          path: |
            data/manifest.json
            data/SHA256SUMS
            data/subscriptions/
            data/snapshot/
            data/health.json
          if-no-files-found: error
          retention-days: 7

      - name: Publish generated feeds
        run: |
          if [ -z "$(git status --porcelain -- data)" ]; then
            echo "No feed changes to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "chore: refresh subscription feeds"
          git push
